# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Android, Kotlin 2.4.0, AGP 9.2.1, Gradle 9.4.1
  UI: Jetpack Compose (BOM 2026.02.01), Material3, SceneView 4.23.0
  Architecture: MVI + Clean Architecture + Atomic Design (presentation/domain/data layers)
  Package: com.example.amigurumimaker
  Testing: JUnit 4.13.2 (unit), Compose UI Test + Espresso 3.5.1 (instrumented)
  Style: Kotlin official code style; no linter/formatter configured

testing:
  strict_tdd: true
  runner:
    command: "./gradlew test"
    framework: JUnit 4
    variant: android-junit4
  layers:
    unit:
      available: true
      tool: "JUnit 4 + kotlin.test + kotlinx-coroutines-test"
    integration:
      available: true
      tool: "AndroidX Test + Compose UI Test JUnit4 + Espresso Core (on-device)"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: false
    command: "—"
    note: "No JaCoCo or Kover configured; coverage_threshold set to 0"
  quality:
    linter:
      available: false
      command: "—"
    type_checker:
      available: true
      command: "kotlinc (implicit via Gradle)"
    formatter:
      available: false
      command: "—"

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - Follow android-mvi-clean-architecture skill rules (MVI + Clean Architecture + Atomic Design)
    - Apply dependency gate before adding third-party libraries
    tdd: true
    test_command: "./gradlew test"
  verify:
    test_command: "./gradlew test"
    build_command: "./gradlew assembleDebug"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
